name: ai_language_tutor
description: AI-powered English language learning app for Pakistani learners. Understands Urdu & Roman Urdu, replies in English.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Speech & Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^3.8.5

  # HTTP & APIs (only dio, no retrofit)
  dio: ^5.4.0
  google_generative_ai: ^0.4.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # UI Components
  google_fonts: ^6.2.1
  flip_card: ^0.7.0
  percent_indicator: ^4.2.3
  confetti: ^0.7.0
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  fl_chart: ^0.66.0
  smooth_page_indicator: ^1.1.0

  # Firebase & Auth
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.1.0

  # Connectivity
  connectivity_plus: ^6.0.3

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  logger: ^2.3.0
  just_audio: ^0.9.38
  path_provider: ^2.1.3
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.12.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/data/
